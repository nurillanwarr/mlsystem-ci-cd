name: CI Workflow
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'
      - name: Install, Format, Lint, and Test
        run: make all
      - name: Run MLflow Project
        run: mlflow run MLProject
      - name: Build Docker Image
        run: mlflow models build-docker -m runs:/<RUN_ID>/model -n credit_scoring_model
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push Docker Image
        run: |
          docker tag credit_scoring_model ${{ secrets.DOCKER_USERNAME }}/credit_scoring_model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/credit_scoring_model:latest
