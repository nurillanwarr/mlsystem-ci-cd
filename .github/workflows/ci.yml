name: ci.yml
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MLFLOW_ALLOW_FILE_STORE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: make install
      - name: Format code
        run: make format
      - name: Lint code
        run: make lint
      - name: Run tests
        run: make test
      - name: Run MLflow Project
        env:
          MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/mlruns.db"
        run: |
          pip install -r requirements.txt
          mlflow run MLProject --env-manager=local --experiment-name="Breast_Cancer_Experiment"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns/
            mlruns.db
        if: always()
      - name: Commit and Push Artifacts to GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mlruns/ mlruns.db
          git commit -m "Save MLflow artifacts" || echo "No changes to commit"
          git push
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push Docker Image with MLflow
        env:
          MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/mlruns.db"
        run: |
          sudo apt-get install sqlite3
          RUN_ID=$(sqlite3 mlruns.db "SELECT run_uuid FROM runs ORDER BY start_time DESC LIMIT 1;")
          mlflow models build-docker -m "runs:/$RUN_ID/model" -n ${{ secrets.DOCKER_USERNAME }}/mlsystem-model:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mlsystem-model:latest
